---
- hosts: devpc
  become: true

  vars:
    vscode_state: present
    install_extensions: false

  tasks:
    - name: Add Microsoft repository (deb822)
      ansible.builtin.deb822_repository:
        name: vscode
        types: [deb]
        uris: https://packages.microsoft.com/repos/code
        suites: [stable]
        components: [main]
        architectures: [amd64]
        signed_by: https://packages.microsoft.com/keys/microsoft.asc
        state: "{{ vscode_state }}"

    - name: Install VS Code
      ansible.builtin.apt:
        name: code
        state: "{{ vscode_state }}"
        update_cache: false
