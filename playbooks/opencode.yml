---
- hosts: devpc
  become: true

  vars:
    opencode_state: present
    opencode_download_dest: "/tmp/ansible/opencode/"
    version: "1.17.11"

  tasks:
    - name: Create tmp directory
      ansible.builtin.file:
        state: directory
        path: "{{ opencode_download_dest }}"
        mode: '0700'
      when: opencode_state == 'present'

    - name: Download OpenCode Desktop .deb file
      ansible.builtin.get_url:
        url: "https://github.com/anomalyco/opencode/releases/download/v{{ version }}/opencode-desktop-linux-amd64.deb"
        dest: "{{ opencode_download_dest }}opencode.deb"
        mode: '0600'
      when: opencode_state == 'present'

    - name: Install OpenCode Desktop
      ansible.builtin.apt:
        deb: "{{ opencode_download_dest }}opencode.deb"
      when: opencode_state == 'present'

    - name: Delete tmp directory
      ansible.builtin.file:
        state: absent
        path: "{{ opencode_download_dest }}"
      when: opencode_state == 'present'

    - name: Uninstall OpenCode Desktop
      ansible.builtin.apt:
        name: opencode
        state: absent
      when: opencode_state == 'absent'
